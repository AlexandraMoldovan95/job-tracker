# Runs the unit tests for logic.js (escaping, auth messages, Dashboard numbers, resume export)
# on every push and pull request. Plain Node, no packages to install, no Supabase.
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/*.test.js"
